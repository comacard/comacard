[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# remappings live in remappings.txt so editors and tooling pick them up too

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin = "${CREDITCOIN_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 2048
