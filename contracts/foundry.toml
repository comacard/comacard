[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules", "../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@gluwa/=node_modules/@gluwa/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin = "${CREDITCOIN_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
