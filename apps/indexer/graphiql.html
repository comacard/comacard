<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comacard — GraphiQL</title>
    <style>
      body { margin: 0; }
      #graphiql { height: calc(100dvh - 46px); }
      .loading { height:100%; display:flex; align-items:center; justify-content:center; font-size:2rem; }
      #bar { display:flex; gap:8px; align-items:center; padding:7px 10px;
              background:#0f1115; border-bottom:1px solid #252a34;
              font:13px ui-sans-serif,system-ui,sans-serif; color:#8b93a7; }
      #bar input { flex:1; min-width:240px; background:#171a21; color:#e6e9ef;
                    border:1px solid #252a34; border-radius:6px; padding:5px 9px;
                    font:12px ui-monospace,Menlo,monospace; }
      #bar button { background:#7cc4ff; color:#05070a; border:0; border-radius:6px;
                     padding:6px 12px; font:inherit; font-weight:600; cursor:pointer; }
    </style>
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@5.4.0/dist/style.css"
      integrity="sha384-TFpQQKp325U5sd3PddH4cS0KOB3Gz/aqdEe12Mqkkq3wm2MGcDhRX5WhWf+o8akh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://esm.sh/@graphiql/plugin-explorer@5.1.5/dist/style.css"
      integrity="sha384-vTFGj0krVqwFXLB7kq/VHR0/j2+cCT/B63rge2mULaqnib2OX7DVLUVksTlqvMab"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.8",
          "react/": "https://esm.sh/react@19.2.8/",
          "react-dom": "https://esm.sh/react-dom@19.2.8",
          "react-dom/": "https://esm.sh/react-dom@19.2.8/",
          "graphiql": "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@5.4.0/",
          "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.5?standalone&external=react,@graphiql/react,graphql",
          "@graphiql/react": "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        },
        "integrity": {
          "https://esm.sh/react@19.2.8": "sha384-ZLbEMZxxxJSWKr0slZZsXGR6UNzfnEk4+qYI9PLH9QSxvWWQjs3UgkzrGuo33roA",
          "https://esm.sh/react-dom@19.2.8": "sha384-jssD0f2tUCDrNPAwM/2fFwybg7wF0K+9oVfFE0a7r0n7wb2UVP4/uYyWIZKGxG6L",
          "https://esm.sh/graphiql@5.4.0": "sha384-moUMjxK/ZmHQE08otOtzYT/Zke32MqPb9l0uUXUdsf8aXl53LPYBciaAf9ON2nuR",
          "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-P5rs3WtMR+YUHbk+eUuomiB3Grin+04e9jKjuOY5KMBdjnl/qOUaCALfnVqVpIL8",
          "https://esm.sh/@graphiql/plugin-explorer@5.1.5": "sha384-hIrTiRjlICooYpU/kh97YrhFmYbV5WhIa37reJgertKXzyaM6kzkJaDUlQWs9+vb",
          "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-snSfFGTvNof5jyaw3xkRx7zsKRy9DWiljMvYXoo+zIwrhQv/h2pWOH81boYwk5P2",
          "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql": "sha384-+cNTwZgIW33q7A4E+ZoCMqzcXdfVIc2VthQvJ0uDpRXERBWYuDKPVMzvdQU8x48o",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
        }
      }
    </script>
    <script type="module">
      import { explorerPlugin } from '@graphiql/plugin-explorer';
      import { createGraphiQLFetcher } from '@graphiql/toolkit';
      import { GraphiQL, HISTORY_PLUGIN } from 'graphiql';
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import 'graphiql/setup-workers/esm.sh';

      // Every Envio deployment gets its own URL, so this has to be replaceable
      // without editing the file. ?endpoint= wins, then whatever was used last.
      const FALLBACK = 'https://indexer.dev.hyperindex.xyz/5d01570/v1/graphql';
      const url = new URLSearchParams(location.search).get('endpoint')
        || localStorage.getItem('comacard.endpoint')
        || FALLBACK;

      const input = document.getElementById('endpoint');
      input.value = url;
      document.getElementById('use').onclick = () => {
        localStorage.setItem('comacard.endpoint', input.value.trim() || FALLBACK);
        location.search = '';
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('use').click();
      });

      const defaultQuery = `# Comacard indexer. Ctrl-Space for suggestions, or use the
# Explorer on the left to build a query by clicking.

{
  Account(order_by: { creditLimit: desc }) {
    id
    collateral
    drawn
    score
    creditLimit
    available
    provenNonce
  }

  # Each row is one Attestcoin proof; the id is the queryId the
  # contract marks as processed, so credit traces back to its proof.
  Attestation(order_by: { blockNumber: desc }) {
    kind
    account
    amount
    txHash
  }

  chain_metadata {
    chain_id
    latest_processed_block
    is_hyper_sync
  }
}
`;

      const fetcher = createGraphiQLFetcher({ url });
      const plugins = [HISTORY_PLUGIN, explorerPlugin()];

      const App = () => React.createElement(GraphiQL, {
        fetcher,
        plugins,
        defaultQuery,
        defaultEditorToolsVisibility: true,
      });

      ReactDOM.createRoot(document.getElementById('graphiql'))
        .render(React.createElement(App));
    </script>
  </head>
  <body>
    <div id="bar">
      <span>endpoint</span>
      <input id="endpoint" spellcheck="false" aria-label="Indexer GraphQL endpoint" />
      <button type="button" id="use">Use</button>
    </div>
    <div id="graphiql"><div class="loading">Loading…</div></div>
  </body>
</html>
