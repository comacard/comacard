# Comacard indexer.
#
# Seven chains now. Two very different sync paths. Sepolia is on Envio's HyperSync so
# it syncs in seconds. Creditcoin CC3 is not, so it reads over plain RPC — which
# is fine here: the chain produces a block every 15 seconds and these contracts
# were deployed days ago, so there is almost nothing to catch up on.
name: comacard
description: Credit lines sized by proved onchain history

# Only what the handlers actually read. Every extra field is data pulled over
# the wire for every event, which matters most on the RPC chain.
# No per-contract `handler:` — every file in src/handlers is loaded. Naming one
# file per contract makes Envio skip the rest, so token handlers living in their
# own file would silently never run.
field_selection:
  transaction_fields:
    - hash

# The same vault contract runs on every chain Attestcoin cannot reach, so its
# events are declared once here and each chain only supplies an address.
contracts:
  # One per chain, same contract, so its events are declared once here too.
  - name: ReleaseRelay
    events:
      - event: Released(address indexed account, address indexed token, uint256 amount, bytes32 vaaHash)

  - name: WormholeVault
    events:
      - event: Locked(address indexed account, address indexed token, uint256 amount, uint64 sequence)
      - event: Unlocked(address indexed account, address indexed token, uint256 amount)
      - event: ReleaseApproved(address indexed account, address indexed token, uint256 amount)

chains:
  # ---- Ethereum Sepolia: where collateral is locked and stays ----
  - id: 11155111
    start_block: 11668664
    contracts:
      - name: SourceVault
        address:
          - 0x911290c37E9558C704870f4C44CBdEA1B2B33303
        events:
          - event: CollateralLocked(address indexed account, uint256 amount, uint256 nonce)
          - event: CollateralUnlocked(address indexed account, uint256 amount, uint256 nonce)
          - event: ReleaseApproved(address indexed account, uint256 amount)
          - event: TokenLocked(address indexed account, address indexed token, uint256 amount, uint256 nonce)
          - event: TokenUnlocked(address indexed account, address indexed token, uint256 amount, uint256 nonce)

  # ---- Creditcoin CC3 testnet: where credit lives ----
  - id: 102031
    start_block: 5458366
    rpc:
      - url: https://rpc.cc3-testnet.creditcoin.network
        for: sync
    contracts:
      - name: ASCCreditLine
        address:
          - 0x18052272cC69113DE2b45d2BDB4E1fB287F4E906
        events:
          - event: ScoreChanged(address indexed account, uint256 score, uint256 limit, uint256 available)
          - event: CollateralCredited(address indexed account, uint256 amount, bytes32 indexed queryId)
          - event: CollateralReleased(address indexed account, uint256 amount, bytes32 indexed queryId)
          - event: HistoryImported(address indexed account, uint64 provenNonce, bytes32 indexed queryId)
          - event: Drawn(address indexed account, uint256 amount, uint256 outstanding, uint64 dueAt)
          - event: Repaid(address indexed account, uint256 amount, uint256 outstanding)
          - event: Defaulted(address indexed account, uint256 writtenOff, uint256 collateralSeized)
          - event: ReleaseHeld(address indexed account, uint256 amount, uint256 pending)
          - event: CollateralPriceChanged(uint256 from, uint256 to)
          - event: TokenListed(address indexed token, uint8 decimals, uint256 price)
          - event: TokenPriceChanged(address indexed token, uint256 from, uint256 to)
          - event: TokenCollateralCredited(address indexed account, address indexed token, uint256 amount, bytes32 indexed queryId)
          - event: TokenCollateralReleased(address indexed account, address indexed token, uint256 amount, bytes32 indexed queryId)
          - event: TokenReleaseHeld(address indexed account, address indexed token, uint256 amount, uint256 pending)

      - name: CtcStakingAdapter
        address:
          - 0xA94218Dbdb142A10e32eF7b494105D27F47f7045
        events:
          - event: Delegated(address indexed stakingAccount, uint256 amount)
          - event: PrincipalReturned(uint256 amount)
          - event: RewardsReported(uint256 amount)

      # Deposits that arrived by Wormhole rather than by Attestcoin.
      - name: WormholeCollateralHub
        address:
          - 0x9D77f5E1D5Afe5258cA16F808DC5BA1E9F68437f
        events:
          - event: AssetListed(bytes32 indexed assetId, uint16 indexed chainId, bytes32 token, uint8 decimals, uint256 price)
          - event: AssetPriceChanged(bytes32 indexed assetId, uint256 from, uint256 to)
          - event: RemoteCollateralCredited(address indexed account, bytes32 indexed assetId, uint256 amount, bytes32 indexed vaaHash)
          - event: ReleaseRequested(address indexed account, bytes32 indexed assetId, uint256 amount, uint64 sequence)

  # ---- Chains Attestcoin cannot reach. A vault each, all the same contract ----
  #
  # The vault publishes at finalized consistency, so the guardians sign roughly
  # fifteen minutes after a deposit. Until then the deposit shows here as locked
  # and not credited, which is the truth rather than a gap.
  - id: 84532
    start_block: 46713760
    contracts:
      - name: WormholeVault
        address:
          - 0x7439dff6270C2B52B00B7Fc5CA94c56d5b166Daf

      - name: ReleaseRelay
        address:
