"""
A borrower, as the chain sees them.

The derived fields — score, limit, available — are taken straight from the
contract's ScoreChanged event rather than recomputed here. The scoring maths
lives in CreditScoring.sol and stays there; duplicating it in TypeScript is how
an indexer quietly starts disagreeing with the chain it indexes.
"""
type Account {
  id: ID! # borrower address
  collateral: BigInt!
  drawn: BigInt!
  pendingRelease: BigInt!
  provenNonce: BigInt!

  score: BigInt!
  """
  As of this account's last on-chain activity, not as of now. The limit also
  moves when the protocol reprices collateral, and that changes every account
  at once without emitting anything per account — so after a price change this
  is stale until the account next transacts. Read `limitOf` from the contract
  for a live figure; use this one for history.
  """
  creditLimit: BigInt!
  available: BigInt!

  cycleCount: Int!
  repayCount: Int!
  defaultCount: Int!

  totalDrawn: BigInt!
  totalRepaid: BigInt!
  totalWrittenOff: BigInt!

  dueAt: BigInt!
  firstSeenAt: BigInt!
  lastActiveAt: BigInt!

  locks: [CollateralLock!]! @derivedFrom(field: "account")
  draws: [Draw!]! @derivedFrom(field: "account")
  repayments: [Repayment!]! @derivedFrom(field: "account")
  defaults: [Default!]! @derivedFrom(field: "account")
}

"A collateral lock or unlock observed on the source chain."
type CollateralLock {
  id: ID!
  account: Account!
  amount: BigInt!
  nonce: BigInt!
  released: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String!
}

type Draw {
  id: ID!
  account: Account!
  amount: BigInt!
  outstandingAfter: BigInt!
  dueAt: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String!
}

type Repayment {
  id: ID!
  account: Account!
  amount: BigInt!
  outstandingAfter: BigInt!
  settled: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String!
}

type Default {
  id: ID!
  account: Account!
  writtenOff: BigInt!
  collateralSeized: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String!
}

"An Attestcoin proof landing on Creditcoin, and what it carried."
type Attestation {
  id: ID! # queryId
  account: String!
  kind: String! # collateral_credited | collateral_released | history_imported
  amount: BigInt!
  provenNonce: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String!
}

"Where idle liquidity sits and what it has earned."
type YieldPosition {
  id: ID! # adapter address
  deployedPrincipal: BigInt!
  accruedRewards: BigInt!
  totalDelegated: BigInt!
  totalReturned: BigInt!
  lastUpdatedAt: BigInt!
}

type Protocol {
  id: ID!
  accounts: Int!
  """
  What one whole unit of collateral is worth in the credit asset, 18dp.
  """
  collateralPrice: BigInt!
  pricedAt: BigInt!
  totalCollateral: BigInt!
  outstanding: BigInt!
  lifetimeDrawn: BigInt!
  lifetimeRepaid: BigInt!
  lifetimeDefaulted: BigInt!
  defaultCount: Int!
}

"""
A token the credit line accepts as collateral. The list an app shows a
cardholder comes from here, so it can never offer an asset the contract would
refuse.
"""
type Token {
  id: ID! # source-chain token address
  decimals: Int!
  """
  Credit-asset wei per one whole token, 18dp. Operator-fed on testnet.
  """
  price: BigInt!
  listedAt: BigInt!
  pricedAt: BigInt!
  positions: [TokenPosition!]! @derivedFrom(field: "token")
}

"""
One account's collateral in one token. Amounts are in the token's own base
units — divide by 10^decimals from the Token row to show whole tokens.
"""
type TokenPosition {
  id: ID! # account-token
  account: String!
  token: Token!
  locked: BigInt!
  credited: BigInt!
  pendingRelease: BigInt!
  lastActiveAt: BigInt!
}

"""
An asset the credit line accepts from a chain Attestcoin cannot reach.

Keyed by chain and address together — USDC on Base and USDC on Arbitrum are
different tokens in different vaults, and a depeg on one says nothing about the
other. The id is the contract's own assetId, keccak256(chainId ++ token).
"""
type RemoteAsset {
  id: ID! # assetId
  """
  Wormhole chain id: 10004 Base Sepolia, 10003 Arbitrum Sepolia.
  """
  wormholeChainId: Int!
  """
  Token address on its own chain, or the zero address for the native coin.
  """
  token: String!
  decimals: Int!
  """
  Credit-asset wei per one whole unit, 18dp. Operator-fed on testnet.
  """
  price: BigInt!
  listedAt: BigInt!
  pricedAt: BigInt!
  deposits: [RemoteDeposit!]! @derivedFrom(field: "asset")
}

"""
One deposit on a remote chain, from the moment it is locked to the moment it is
credited on Creditcoin.

`creditedAt` is null while the guardians are still signing. That gap is not a
bug and an app should say so: the vaults publish at finalized consistency, so an
L2 deposit waits on Ethereum finality, roughly fifteen minutes.
"""
type RemoteDeposit {
  id: ID! # chainId-sequence
  """
  Indexed so a credit landing on Creditcoin can find the lock it belongs to.
  """
  account: String! @index
  asset: RemoteAsset!
  amount: BigInt!
  """
  Wormhole message sequence. What the relayer needs to fetch the VAA.
  """
  sequence: BigInt!
  lockedAt: BigInt!
  lockBlock: BigInt!
  lockTxHash: String!
  creditedAt: BigInt
  creditTxHash: String
  vaaHash: String
}

"""
What one account holds on one remote asset. `locked` is what the vault on that
chain is holding; `credited` is what Creditcoin has actually counted toward a
limit. They differ while a message is in flight.
"""
type RemotePosition {
  id: ID! # account-assetId
  account: String!
  asset: RemoteAsset!
  locked: BigInt!
  credited: BigInt!
  releasable: BigInt!
  lastActiveAt: BigInt!
}

"""
One withdrawal, from the moment Creditcoin agrees to it until the borrower has
the money. Three stages, because they are three transactions on two chains and a
UI that collapses them tells the user they are done before they are.

`requestedAt` — the borrower asked, and the credit is already gone on Creditcoin.
`approvedAt`  — the guardians signed and the relay let the vault release it.
`withdrawnAt` — the borrower took it. Only here is it in their wallet.

Null after the first means still in flight, the same convention RemoteDeposit
uses. Between approved and withdrawn nothing is waiting on the protocol: the
money is sitting there and the borrower has not signed for it yet.
"""
type RemoteWithdrawal {
  id: ID! # wormholeChainId-sequence
  """
  Indexed so a relay's Released event can find the request it belongs to.
  """
  account: String! @index
  asset: RemoteAsset!
  amount: BigInt!
  """
  Wormhole message sequence from the hub. What a relayer needs to fetch it.
  """
  sequence: BigInt!

  requestedAt: BigInt!
  requestTxHash: String!
  approvedAt: BigInt
  approveTxHash: String
  vaaHash: String
  withdrawnAt: BigInt
  withdrawTxHash: String
}

"""
A release the far chain has acted on, before Creditcoin's side of it is indexed.

Chains do not sync in step — Creditcoin reads over plain RPC while the others are
on HyperSync, so a relay's Released arrives long before the hub's
ReleaseRequested that it belongs to. Whichever lands second does the matching,
and this is where the first one waits. Rows here are an implementation detail of
that; read RemoteWithdrawal.
"""
type PendingReleaseStage {
  id: ID! # account-assetId-amount-stage
  account: String! @index
  assetId: String!
  amount: BigInt!
  """
  approved | withdrawn
  """
  stage: String!
  at: BigInt!
  txHash: String!
}
