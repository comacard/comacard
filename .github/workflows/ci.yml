name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  # husky only manages local git hooks; CI has no use for them
  HUSKY: 0

jobs:
  javascript:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      # The contracts workspace is driven by forge, which this job has no need
      # to install — the contracts job below owns it.
      - name: Typecheck
        run: bunx turbo run typecheck --filter='!@comacard/contracts'

      - name: Test
        run: bunx turbo run test --filter='!@comacard/contracts'

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1

      # Solidity dependencies resolve through node_modules via foundry remappings
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
